<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Équipe — Radio Télé Unité (RTU)</title>
<meta name="description" content="Les animateurs, journalistes et techniciens de Radio Télé Unité (RTU)." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy-deep:#070A1C; --navy:#0D1230; --navy-panel:#121840;
  --blue:#3E7BFA; --blue-soft:#7FA4FF;
  --gold:#E8B84B; --gold-hover:#D6A53A;
  --ivory:#F6F4EE; --ink:#0B0F2E; --ink-soft:#8890AC;
  --line:rgba(255,255,255,.09);
  --font-display:"Space Grotesk", sans-serif;
  --font-body:"Inter", sans-serif;
  --font-mono:"JetBrains Mono", monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0; font-family:var(--font-body); background:var(--ivory); color:var(--ink); -webkit-font-smoothing:antialiased;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
h1,h2,h3{margin:0; font-family:var(--font-display); font-weight:700;}
p{margin:0;}
.wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
@media (max-width:640px){ .wrap{padding:0 18px;} }

.eq{display:inline-flex; align-items:flex-end; gap:3px; height:16px;}
.brand-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.eq span{width:3px; background:var(--gold); border-radius:2px; animation:eqbounce 1.1s ease-in-out infinite;}
.eq span:nth-child(1){height:40%; animation-delay:-0.9s;}
.eq span:nth-child(2){height:100%; animation-delay:-0.4s;}
.eq span:nth-child(3){height:65%; animation-delay:-1.1s;}
.eq span:nth-child(4){height:85%; animation-delay:-0.2s;}
.eq span:nth-child(5){height:50%; animation-delay:-0.6s;}
@keyframes eqbounce{0%,100%{transform:scaleY(0.35);} 50%{transform:scaleY(1);}}

.nav{position:sticky; top:0; z-index:60; background:rgba(7,10,28,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
.nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 0;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .mark{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:18px;}
.brand .mark .r{color:var(--blue-soft);} .brand .mark .t{color:#fff;} .brand .mark .u{color:var(--gold);}
.nav-links{display:flex; align-items:center; gap:24px;}
.nav-links a{font-size:13px; font-weight:600; color:rgba(255,255,255,.7); transition:color .15s; white-space:nowrap;}
.nav-links a:hover, .nav-links a.active{color:#fff;}
.nav-right{display:flex; align-items:center; gap:16px;}
.lang-select{
  appearance:none; background:rgba(255,255,255,.06); border:1px solid var(--line); color:#fff;
  font-size:12px; font-weight:600; font-family:var(--font-mono); padding:7px 26px 7px 12px; border-radius:20px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M0 0l4.5 5.5L9 0z' fill='%238890AC'/></svg>");
  background-repeat:no-repeat; background-position:right 11px center;
}
.lang-select option{color:#111; background:#fff;}
.nav-cta{display:flex; align-items:center; gap:8px; background:var(--gold); color:var(--ink); font-weight:700; font-size:12.5px; padding:9px 16px; border-radius:20px; border:none;}
@media (max-width:1000px){ .nav-links{display:none;} }

.page-hero{background:linear-gradient(155deg, var(--navy-panel), var(--navy-deep)); color:#fff; padding:60px 0 54px;}
.page-hero .eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.14em; color:var(--blue-soft); text-transform:uppercase; margin-bottom:12px;}
.page-hero h1{font-size:clamp(28px,3.6vw,42px); margin-bottom:12px;}
.page-hero p{color:rgba(255,255,255,.62); font-size:15px; max-width:520px;}

.pad{padding:64px 0 90px;}
.role-block{margin-bottom:52px;}
.role-block:last-child{margin-bottom:0;}
.role-head{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-hover); margin-bottom:22px; padding-bottom:12px; border-bottom:1px solid #E7E3D8;}
.team-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
@media (max-width:900px){ .team-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:560px){ .team-grid{grid-template-columns:1fr;} }
.team-card{background:#fff; border:1px solid #E7E3D8; border-radius:16px; padding:24px; transition:transform .15s var(--ease), box-shadow .15s;}
.team-card:hover{transform:translateY(-3px); box-shadow:0 16px 34px -18px rgba(11,15,46,.18);}
.avatar{width:56px; height:56px; border-radius:50%; background:linear-gradient(155deg, var(--blue-soft), var(--blue)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:19px; margin-bottom:16px;}
.team-card h3{font-size:16px; margin-bottom:4px;}
.team-card .show{font-size:12px; color:var(--gold-hover); font-weight:700; margin-bottom:10px;}
.team-card p{font-size:12.5px; color:#6B7085; line-height:1.55;}
.empty-note{padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:14px;}

footer{background:var(--navy); border-top:1px solid var(--line); padding:44px 0 24px; color:#fff;}
.foot-bottom{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
.foot-bottom p{font-size:12px; color:rgba(255,255,255,.45); margin:0;}
.foot-links{display:flex; gap:18px; flex-wrap:wrap;}
.foot-links a{font-size:13px; color:rgba(255,255,255,.7);}
.foot-links a:hover{color:#fff;}
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap nav-inner">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="RTU" class="brand-logo" />
      <span class="mark"><span class="r">R</span><span class="t">T</span><span class="u">U</span></span>
      <span class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
    </a>
    <div class="nav-links">
      <a href="apropos.html" data-i18n="nav_about">À propos</a>
      <a href="programmes.html" data-i18n="nav_programs">Programmes</a>
      <a href="equipe.html" class="active" data-i18n="nav_team">Équipe</a>
      <a href="galerie.html" data-i18n="nav_gallery">Galerie</a>
      <a href="actualites.html" data-i18n="nav_news">Actualités</a>
      <a href="contact.html" data-i18n="nav_contact">Contact</a>
    </div>
    <div class="nav-right">
      <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
        <option value="fr">FR</option><option value="ht">HT</option><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option>
      </select>
      <a href="index.html#direct" class="nav-cta"><span aria-hidden="true">▶</span><span data-i18n="nav_cta">Écouter</span></a>
    </div>
  </div>
</nav>

<header class="page-hero">
  <div class="wrap">
    <div class="eyebrow" data-i18n="ph_eyebrow">DERRIÈRE LE MICRO</div>
    <h1 data-i18n="ph_title">Notre équipe</h1>
    <p data-i18n="ph_desc">Les voix et les visages qui font vivre RTU chaque jour.</p>
  </div>
</header>

<section class="pad">
  <div class="wrap" id="teamWrap">
    <p class="empty-note" data-i18n="loading">Chargement de l'équipe…</p>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-bottom">
      <p data-i18n="footer_rights">© 2026 Radio Télé Unité (RTU). Tous droits réservés.</p>
      <div class="foot-links">
        <a href="index.html">Accueil</a>
        <a href="apropos.html" data-i18n="nav_about">À propos</a>
        <a href="galerie.html" data-i18n="nav_gallery">Galerie</a>
        <a href="contact.html" data-i18n="nav_contact">Contact</a>
      </div>
    </div>
  </div>
</footer>

<script>
const translations = {
  fr:{ nav_about:"À propos", nav_programs:"Programmes", nav_team:"Équipe", nav_gallery:"Galerie", nav_news:"Actualités", nav_contact:"Contact", nav_cta:"Écouter",
    ph_eyebrow:"DERRIÈRE LE MICRO", ph_title:"Notre équipe", ph_desc:"Les voix et les visages qui font vivre RTU chaque jour.",
    loading:"Chargement de l'équipe…", no_team:"Aucun membre à afficher pour le moment.",
    role_animateur:"Animateurs", role_journaliste:"Journalistes", role_technicien:"Techniciens", role_admin:"Direction", role_other:"Équipe",
    footer_rights:"© 2026 Radio Télé Unité (RTU). Tous droits réservés." },
  ht:{ nav_about:"Konsènan", nav_programs:"Pwogram", nav_team:"Ekip", nav_gallery:"Galri", nav_news:"Aktyalite", nav_contact:"Kontak", nav_cta:"Koute",
    ph_eyebrow:"DÈYÈ MIKWO A", ph_title:"Ekip nou an", ph_desc:"Vwa ak figi ki fè RTU vivan chak jou.",
    loading:"Chajman ekip la…", no_team:"Pa gen okenn manm pou montre kounye a.",
    role_animateur:"Animatè", role_journaliste:"Jounalis", role_technicien:"Teknisyen", role_admin:"Direksyon", role_other:"Ekip",
    footer_rights:"© 2026 Radio Télé Unité (RTU). Tout dwa rezève." },
  en:{ nav_about:"About", nav_programs:"Programs", nav_team:"Team", nav_gallery:"Gallery", nav_news:"News", nav_contact:"Contact", nav_cta:"Listen",
    ph_eyebrow:"BEHIND THE MIC", ph_title:"Our team", ph_desc:"The voices and faces that bring RTU to life every day.",
    loading:"Loading team…", no_team:"No team members to display right now.",
    role_animateur:"Hosts", role_journaliste:"Journalists", role_technicien:"Technicians", role_admin:"Management", role_other:"Team",
    footer_rights:"© 2026 Radio Télé Unité (RTU). All rights reserved." },
  es:{ nav_about:"Nosotros", nav_programs:"Programas", nav_team:"Equipo", nav_gallery:"Galería", nav_news:"Noticias", nav_contact:"Contacto", nav_cta:"Escuchar",
    ph_eyebrow:"DETRÁS DEL MICRÓFONO", ph_title:"Nuestro equipo", ph_desc:"Las voces y los rostros que dan vida a RTU cada día.",
    loading:"Cargando equipo…", no_team:"No hay miembros para mostrar por ahora.",
    role_animateur:"Presentadores", role_journaliste:"Periodistas", role_technicien:"Técnicos", role_admin:"Dirección", role_other:"Equipo",
    footer_rights:"© 2026 Radio Télé Unité (RTU). Todos los derechos reservados." },
  pt:{ nav_about:"Sobre", nav_programs:"Programas", nav_team:"Equipe", nav_gallery:"Galeria", nav_news:"Notícias", nav_contact:"Contato", nav_cta:"Ouvir",
    ph_eyebrow:"POR TRÁS DO MICROFONE", ph_title:"Nossa equipe", ph_desc:"As vozes e rostos que dão vida à RTU todos os dias.",
    loading:"Carregando equipe…", no_team:"Nenhum membro para exibir no momento.",
    role_animateur:"Apresentadores", role_journaliste:"Jornalistas", role_technicien:"Técnicos", role_admin:"Direção", role_other:"Equipe",
    footer_rights:"© 2026 Radio Télé Unité (RTU). Todos os direitos reservados." }
};
function getCurrentLang(){ return localStorage.getItem('rtu_lang') || 'fr'; }
function setLang(lang){
  localStorage.setItem('rtu_lang', lang);
  document.getElementById('langSelect').value = lang;
  const dict = translations[lang] || translations.fr;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(dict[key] !== undefined) el.textContent = dict[key];
  });
}
setLang(getCurrentLang());

const SUPABASE_URL = 'https://dznqpltxfhpuorxxwypb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_GPyfox6GpwC1HK-fwchdEw_XdkKOhQ1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function initials(name){
  return (name || '').split(' ').filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('');
}

const ROLE_ORDER = ['animateur','journaliste','technicien','admin'];

async function loadTeam(){
  const wrap = document.getElementById('teamWrap');
  const dict = translations[getCurrentLang()] || translations.fr;
  const { data, error } = await sb.from('team_members').select('*').eq('active', true).order('display_order');
  if(error || !data || !data.length){
    wrap.innerHTML = `<p class="empty-note">${dict.no_team}</p>`;
    return;
  }
  const groups = {};
  data.forEach(m => {
    const role = m.role || 'other';
    if(!groups[role]) groups[role] = [];
    groups[role].push(m);
  });
  const orderedKeys = [...ROLE_ORDER.filter(r => groups[r]), ...Object.keys(groups).filter(r => !ROLE_ORDER.includes(r))];

  wrap.innerHTML = orderedKeys.map(role => `
    <div class="role-block">
      <div class="role-head">${dict['role_' + role] || dict.role_other}</div>
      <div class="team-grid">
        ${groups[role].map(m => `
          <div class="team-card">
            <div class="avatar">${initials(m.full_name)}</div>
            <h3>${m.full_name}</h3>
            ${m.show_name ? `<div class="show">${m.show_name}</div>` : ''}
            <p>${m.bio || ''}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}
loadTeam();
</script>

</body>
</html>
