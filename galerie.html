<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galerie — Radio Télé Unité (RTU)</title>
<meta name="description" content="Photos et vidéos de Radio Télé Unité (RTU) — studio, coulisses, événements." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy-deep:#070A1C; --navy:#0D1230; --navy-panel:#121840;
  --blue:#3E7BFA; --blue-soft:#7FA4FF;
  --gold:#E8B84B; --gold-hover:#D6A53A;
  --ivory:#F6F4EE; --ink:#0B0F2E; --ink-soft:#8890AC;
  --line:rgba(255,255,255,.09);
  --font-display:"Space Grotesk", sans-serif;
  --font-body:"Inter", sans-serif;
  --font-mono:"JetBrains Mono", monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0; font-family:var(--font-body); background:var(--navy-deep); color:#fff; -webkit-font-smoothing:antialiased;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
h1,h2,h3{margin:0; font-family:var(--font-display); font-weight:700;}
p{margin:0;}
.wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
@media (max-width:640px){ .wrap{padding:0 18px;} }

.eq{display:inline-flex; align-items:flex-end; gap:3px; height:16px;}
.eq span{width:3px; background:var(--gold); border-radius:2px; animation:eqbounce 1.1s ease-in-out infinite;}
.eq span:nth-child(1){height:40%; animation-delay:-0.9s;}
.eq span:nth-child(2){height:100%; animation-delay:-0.4s;}
.eq span:nth-child(3){height:65%; animation-delay:-1.1s;}
.eq span:nth-child(4){height:85%; animation-delay:-0.2s;}
.eq span:nth-child(5){height:50%; animation-delay:-0.6s;}
@keyframes eqbounce{0%,100%{transform:scaleY(0.35);} 50%{transform:scaleY(1);}}

.nav{position:sticky; top:0; z-index:60; background:rgba(7,10,28,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
.nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 0;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-logo{height:40px;width:auto;display:block;}
.brand .mark{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:18px;}
.brand .mark .r{color:var(--blue-soft);} .brand .mark .t{color:#fff;} .brand .mark .u{color:var(--gold);}
.nav-links{display:flex; align-items:center; gap:24px;}
.nav-links a{font-size:13px; font-weight:600; color:rgba(255,255,255,.7); transition:color .15s; white-space:nowrap;}
.nav-links a:hover, .nav-links a.active{color:#fff;}
.nav-right{display:flex; align-items:center; gap:16px;}
.lang-select{
  appearance:none; background:rgba(255,255,255,.06); border:1px solid var(--line); color:#fff;
  font-size:12px; font-weight:600; font-family:var(--font-mono); padding:7px 26px 7px 12px; border-radius:20px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6'><path d='M0 0l4.5 5.5L9 0z' fill='%238890AC'/></svg>");
  background-repeat:no-repeat; background-position:right 11px center;
}
.lang-select option{color:#111; background:#fff;}
.nav-cta{display:flex; align-items:center; gap:8px; background:var(--gold); color:var(--ink); font-weight:700; font-size:12.5px; padding:9px 16px; border-radius:20px; border:none;}
@media (max-width:1000px){ .nav-links{display:none;} }

.page-hero{padding:60px 0 32px; background:radial-gradient(circle at 20% 20%, rgba(62,123,250,.18), transparent 55%), var(--navy-deep);}
.page-hero .eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.14em; color:var(--blue-soft); text-transform:uppercase; margin-bottom:12px;}
.page-hero h1{font-size:clamp(28px,3.6vw,42px); margin-bottom:12px;}
.page-hero p{color:rgba(255,255,255,.6); font-size:15px; max-width:520px;}

.filter-row{display:flex; gap:10px; padding:24px 0 8px;}
.filter-btn{
  font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  padding:9px 18px; border-radius:20px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:rgba(255,255,255,.7);
  transition:all .15s;
}
.filter-btn:hover{background:rgba(255,255,255,.1); color:#fff;}
.filter-btn.active{background:var(--gold); color:var(--ink); border-color:var(--gold);}

.pad{padding:16px 0 90px;}
.gallery-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:900px){ .gallery-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:560px){ .gallery-grid{grid-template-columns:1fr;} }
.gallery-item{
  position:relative; border-radius:14px; overflow:hidden; aspect-ratio:4/3; background:var(--navy-panel);
  display:flex; align-items:center; justify-content:center; transition:transform .15s var(--ease);
}
.gallery-item:hover{transform:translateY(-3px);}
.gallery-item img{width:100%; height:100%; object-fit:cover;}
.gallery-item .play-overlay{position:absolute; inset:0; background:rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center;}
.gallery-item .play-overlay svg{width:22px; height:22px; fill:#fff;}
.gallery-item .cap{position:absolute; bottom:0; left:0; right:0; padding:14px; background:linear-gradient(0deg, rgba(0,0,0,.7), transparent); font-size:12.5px; font-weight:600;}
.placeholder-icon{width:36px; height:36px; stroke:rgba(255,255,255,.25); fill:none; stroke-width:1.5;}
.empty-note{padding:60px 20px; text-align:center; color:rgba(255,255,255,.5); font-size:14px;}

footer{background:var(--navy); border-top:1px solid var(--line); padding:44px 0 24px;}
.foot-bottom{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
.foot-bottom p{font-size:12px; color:rgba(255,255,255,.45); margin:0;}
.foot-links{display:flex; gap:18px; flex-wrap:wrap;}
.foot-links a{font-size:13px; color:rgba(255,255,255,.7);}
.foot-links a:hover{color:#fff;}
</style>
<link rel="stylesheet" href="css/partners-ads.css">
</head>
<body>

<nav class="nav">
  <div class="wrap nav-inner">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="RTU - Radio Tele Unite" class="brand-logo"></a>
    <div class="nav-links">
      <a href="apropos.html" data-i18n="nav_about">À propos</a>
      <a href="programmes.html" data-i18n="nav_programs">Programmes</a>
      <a href="equipe.html" data-i18n="nav_team">Équipe</a>
      <a href="galerie.html" class="active" data-i18n="nav_gallery">Galerie</a>
      <a href="actualites.html" data-i18n="nav_news">Actualités</a>
      <a href="contact.html" data-i18n="nav_contact">Contact</a>
    </div>
    <div class="nav-right">
      <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
        <option value="fr">FR</option><option value="ht">HT</option><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option>
      </select>
      <a href="index.html#direct" class="nav-cta"><span aria-hidden="true">▶</span><span data-i18n="nav_cta">Écouter</span></a>
    </div>
  </div>
</nav>

<header class="page-hero">
  <div class="wrap">
    <div class="eyebrow" data-i18n="ph_eyebrow">EN IMAGES</div>
    <h1 data-i18n="ph_title">Galerie RTU</h1>
    <p data-i18n="ph_desc">Studio, coulisses et moments forts, en photos et en vidéos.</p>
  </div>
</header>

<section class="wrap">
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all" data-i18n="filter_all">Tous</button>
    <button class="filter-btn" data-filter="photo" data-i18n="filter_photo">Photos</button>
    <button class="filter-btn" data-filter="video" data-i18n="filter_video">Vidéos</button>
  </div>
</section>

<section class="pad">
  <div class="wrap">
    <div class="gallery-grid" id="galleryWrap">
      <p class="empty-note" data-i18n="loading">Chargement de la galerie…</p>
    </div>
  </div>
</section>

<div id="partners-ads-mount"></div>
<footer>
  <div class="wrap">
    <div class="foot-bottom">
      <p data-i18n="footer_rights">© 2026 Radio Télé Unité (RTU). Tous droits réservés.</p>
      <div class="foot-links">
        <a href="index.html">Accueil</a>
        <a href="apropos.html" data-i18n="nav_about">À propos</a>
        <a href="equipe.html" data-i18n="nav_team">Équipe</a>
        <a href="contact.html" data-i18n="nav_contact">Contact</a>
      </div>
    </div>
  </div>
</footer>

<script>
const translations = {
  fr:{ nav_about:"À propos", nav_programs:"Programmes", nav_team:"Équipe", nav_gallery:"Galerie", nav_news:"Actualités", nav_contact:"Contact", nav_cta:"Écouter",
    ph_eyebrow:"EN IMAGES", ph_title:"Galerie RTU", ph_desc:"Studio, coulisses et moments forts, en photos et en vidéos.",
    filter_all:"Tous", filter_photo:"Photos", filter_video:"Vidéos",
    loading:"Chargement de la galerie…", no_items:"La galerie est vide pour le moment. Revenez bientôt !",
    footer_rights:"© 2026 Radio Télé Unité (RTU). Tous droits réservés." },
  ht:{ nav_about:"Konsènan", nav_programs:"Pwogram", nav_team:"Ekip", nav_gallery:"Galri", nav_news:"Aktyalite", nav_contact:"Kontak", nav_cta:"Koute",
    ph_eyebrow:"AN IMAJ", ph_title:"Galri RTU", ph_desc:"Studyo, koulis ak gwo moman, an foto ak videyo.",
    filter_all:"Tout", filter_photo:"Foto", filter_video:"Videyo",
    loading:"Chajman galri a…", no_items:"Galri a vid kounye a. Retounen talè!",
    footer_rights:"© 2026 Radio Télé Unité (RTU). Tout dwa rezève." },
  en:{ nav_about:"About", nav_programs:"Programs", nav_team:"Team", nav_gallery:"Gallery", nav_news:"News", nav_contact:"Contact", nav_cta:"Listen",
    ph_eyebrow:"IN PICTURES", ph_title:"RTU Gallery", ph_desc:"Studio, behind the scenes, and highlights, in photos and videos.",
    filter_all:"All", filter_photo:"Photos", filter_video:"Videos",
    loading:"Loading gallery…", no_items:"The gallery is empty for now. Check back soon!",
    footer_rights:"© 2026 Radio Télé Unité (RTU). All rights reserved." },
  es:{ nav_about:"Nosotros", nav_programs:"Programas", nav_team:"Equipo", nav_gallery:"Galería", nav_news:"Noticias", nav_contact:"Contacto", nav_cta:"Escuchar",
    ph_eyebrow:"EN IMÁGENES", ph_title:"Galería RTU", ph_desc:"Estudio, detrás de cámaras y momentos destacados, en fotos y videos.",
    filter_all:"Todos", filter_photo:"Fotos", filter_video:"Videos",
    loading:"Cargando galería…", no_items:"La galería está vacía por ahora. ¡Vuelve pronto!",
    footer_rights:"© 2026 Radio Télé Unité (RTU). Todos los derechos reservados." },
  pt:{ nav_about:"Sobre", nav_programs:"Programas", nav_team:"Equipe", nav_gallery:"Galeria", nav_news:"Notícias", nav_contact:"Contato", nav_cta:"Ouvir",
    ph_eyebrow:"EM IMAGENS", ph_title:"Galeria RTU", ph_desc:"Estúdio, bastidores e melhores momentos, em fotos e vídeos.",
    filter_all:"Todos", filter_photo:"Fotos", filter_video:"Vídeos",
    loading:"Carregando galeria…", no_items:"A galeria está vazia no momento. Volte em breve!",
    footer_rights:"© 2026 Radio Télé Unité (RTU). Todos os direitos reservados." }
};
function getCurrentLang(){ return localStorage.getItem('rtu_lang') || 'fr'; }
function setLang(lang){
  localStorage.setItem('rtu_lang', lang);
  document.getElementById('langSelect').value = lang;
  const dict = translations[lang] || translations.fr;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(dict[key] !== undefined) el.textContent = dict[key];
  });
}
setLang(getCurrentLang());

const SUPABASE_URL = 'https://dznqpltxfhpuorxxwypb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_GPyfox6GpwC1HK-fwchdEw_XdkKOhQ1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allItems = [];

function renderGallery(filter){
  const wrap = document.getElementById('galleryWrap');
  const dict = translations[getCurrentLang()] || translations.fr;
  const items = filter === 'all' ? allItems : allItems.filter(i => i.media_type === filter);
  if(!items.length){
    wrap.innerHTML = `<p class="empty-note">${dict.no_items}</p>`;
    return;
  }
  wrap.innerHTML = items.map(item => {
    if(item.media_type === 'video'){
      return `
        <a class="gallery-item" href="${item.media_url}" target="_blank" rel="noopener">
          ${item.thumbnail_url ? `<img src="${item.thumbnail_url}" alt="${item.title || ''}" />` : `<svg class="placeholder-icon" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M8 7l1.5-3h5L16 7"/></svg>`}
          <div class="play-overlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          ${item.title ? `<div class="cap">${item.title}</div>` : ''}
        </a>
      `;
    }
    return `
      <a class="gallery-item" href="${item.media_url}" target="_blank" rel="noopener">
        <img src="${item.media_url}" alt="${item.title || ''}" />
        ${item.title ? `<div class="cap">${item.title}</div>` : ''}
      </a>
    `;
  }).join('');
}

async function loadGallery(){
  const { data, error } = await sb.from('gallery_items').select('*').eq('active', true).order('display_order');
  allItems = (!error && data) ? data : [];
  renderGallery('all');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGallery(btn.getAttribute('data-filter'));
  });
});

loadGallery();
</script>

<script src="js/partners-ads.js"></script>
</body>
</html>
