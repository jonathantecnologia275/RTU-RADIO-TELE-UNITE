<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Actualité — Radio Télé Unité (RTU)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy-deep:#070A1C; --navy:#0D1230; --navy-panel:#121840;
  --blue:#3E7BFA; --blue-soft:#7FA4FF;
  --gold:#E8B84B; --gold-hover:#D6A53A;
  --ivory:#F6F4EE; --ink:#0B0F2E; --ink-soft:#8890AC;
  --line:rgba(255,255,255,.09);
  --font-display:"Space Grotesk", sans-serif;
  --font-body:"Inter", sans-serif;
  --font-mono:"JetBrains Mono", monospace;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0; font-family:var(--font-body); background:var(--ivory); color:var(--ink);}
a{color:inherit; text-decoration:none;}
h1,h2,h3{margin:0; font-family:var(--font-display); font-weight:700;}
p{margin:0;}
.wrap{max-width:760px; margin:0 auto; padding:0 28px;}
@media (max-width:640px){ .wrap{padding:0 18px;} }

.eq{display:inline-flex; align-items:flex-end; gap:3px; height:16px;}
.eq span{width:3px; background:var(--gold); border-radius:2px; animation:eqbounce 1.1s ease-in-out infinite;}
.eq span:nth-child(1){height:40%; animation-delay:-0.9s;}
.eq span:nth-child(2){height:100%; animation-delay:-0.4s;}
.eq span:nth-child(3){height:65%; animation-delay:-1.1s;}
.eq span:nth-child(4){height:85%; animation-delay:-0.2s;}
.eq span:nth-child(5){height:50%; animation-delay:-0.6s;}
@keyframes eqbounce{0%,100%{transform:scaleY(0.35);} 50%{transform:scaleY(1);}}

.nav{background:var(--navy-deep); border-bottom:1px solid var(--line);}
.nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 0; max-width:760px; margin:0 auto; padding-left:28px; padding-right:28px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-logo{height:40px;width:auto;display:block;}
.brand .mark{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:18px; color:#fff;}
.brand .mark .r{color:var(--blue-soft);} .brand .mark .u{color:var(--gold);}
.back-link{font-size:13px; font-weight:600; color:rgba(255,255,255,.7);}
.back-link:hover{color:#fff;}

.article-head{padding:48px 0 28px;}
.cat{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-hover); background:rgba(232,184,75,.12); padding:5px 12px; border-radius:14px; display:inline-block; margin-bottom:16px;}
.article-head h1{font-size:clamp(26px,4vw,36px); line-height:1.2; margin-bottom:14px;}
.article-head .date{font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);}

.article-body{padding-bottom:80px; font-size:16px; line-height:1.8; color:#2A2E45;}
.article-body p{margin-bottom:18px;}
.not-found{padding:80px 0; text-align:center; color:var(--ink-soft);}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="RTU - Radio Tele Unite" class="brand-logo"></a>
    <a href="actualites.html" class="back-link">← Toutes les actualités</a>
  </div>
</nav>

<div class="wrap">
  <div id="articleWrap">
    <p class="not-found">Chargement…</p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://dznqpltxfhpuorxxwypb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_GPyfox6GpwC1HK-fwchdEw_XdkKOhQ1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadArticle(){
  const wrap = document.getElementById('articleWrap');
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(!id){
    wrap.innerHTML = '<p class="not-found">Aucun article spécifié.</p>';
    return;
  }
  const { data, error } = await sb.from('news').select('*').eq('id', id).eq('active', true).maybeSingle();
  if(error || !data){
    wrap.innerHTML = '<p class="not-found">Cet article est introuvable ou a été retiré.</p>';
    return;
  }
  document.title = data.title + ' — Radio Télé Unité (RTU)';
  const paragraphs = (data.content || '').split('\n').filter(p => p.trim().length).map(p => `<p>${p}</p>`).join('');
  wrap.innerHTML = `
    <div class="article-head">
      <span class="cat">${(data.category || '').toUpperCase()}</span>
      <h1>${data.title}</h1>
      <div class="date">${new Date(data.published_at).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'})}</div>
    </div>
    <div class="article-body">${paragraphs || '<p>Contenu à venir.</p>'}</div>
  `;
}
loadArticle();
</script>

</body>
</html>
